[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "repo-doctor"
version = "0.1.0"
description = "A CLI tool to diagnose and fix open source repository health issues"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Jing", email = "TheaJing1995@outlook.com"},
]
keywords = ["open-source", "health-check", "cli", "developer-tools", "repository"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
]
ai = [
    "openai>=1.0",
]

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/repo-doctor"
Repository = "https://github.com/YOUR_USERNAME/repo-doctor"
Issues = "https://github.com/YOUR_USERNAME/repo-doctor/issues"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
